<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canvas LMS Redesign</title>
    <link rel="icon" href="icons/icon32.png" type="image/png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1><img class="logo" src="icons/icon32.png" alt="" width="20" height="20">Canvas Redesign</h1>

    <button id="enable-site" type="button">Enable on this site</button>
    <p id="site-status" class="status"></p>

    <label class="field-label" for="bg-file">Background image</label>
    <!-- Deliberately not image/*: that offers HEIC files the browser can't render. -->
    <input id="bg-file" class="visually-hidden" type="file"
           accept="image/jpeg, image/png, image/webp, image/gif, image/avif" />
    <div class="row">
      <button id="choose-bg" type="button" class="secondary">Choose image…</button>
      <button id="reset-bg" type="button" class="secondary">Reset</button>
    </div>
    <img id="bg-preview" class="preview" alt="Current background" hidden />
    <p id="bg-status" class="status"></p>

    <fieldset class="theme-row">
      <legend class="visually-hidden">Theme</legend>
      <label class="theme-option">
        <span>Light</span>
        <input type="radio" name="theme" value="light" />
      </label>
      <label class="theme-option">
        <span>Hybrid</span>
        <input type="radio" name="theme" value="hybrid" />
      </label>
      <label class="theme-option">
        <span>Dark</span>
        <input type="radio" name="theme" value="dark" />
      </label>
    </fieldset>

    <label class="checkbox-row" for="use-school-accent">
      <input id="use-school-accent" type="checkbox" checked />
      <span>Use school accent colors</span>
    </label>

    <label class="field-label" for="accent-color">Accent color</label>
    <div class="row">
      <input id="accent-color" type="color" value="#b33d3e" />
      <output id="accent-value" for="accent-color">#b33d3e</output>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
